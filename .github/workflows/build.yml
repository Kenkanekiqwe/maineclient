name: Build Maine Client

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Maine Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaineClient-Windows-x64
          path: build/Release/MaineClient.exe
          if-no-files-found: error
